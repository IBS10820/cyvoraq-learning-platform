<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zen Fix Connection Test</title>
<style>body{font-family:system-ui;background:#111;color:#eee;padding:24px;max-width:760px;margin:auto}button{padding:12px 16px;font-weight:700}.ok{color:#70d88b}.bad{color:#ff8f8f}.box{background:#1d1f22;padding:14px;border-radius:10px;margin:12px 0;white-space:pre-wrap;word-break:break-word}</style></head>
<body><h1>Zen Fix & Finish — Connection Test</h1><p>This checks whether your browser can reach the Zen Fix cloud service.</p>
<button onclick="run()">RUN TEST</button><div id="out" class="box">Waiting…</div>
<script>
const base='https://acygyxxzutrbgbxuglns.supabase.co';
const key='sb_publishable_TML8YqclwYaZg-im2UTL-g_ts7tSwS0';
async function probe(name,url,opts={}){
  const t=Date.now();
  try{
    const r=await fetch(url,{cache:'no-store',...opts});
    const txt=await r.text();
    return name+': HTTP '+r.status+' in '+(Date.now()-t)+'ms\n'+txt.slice(0,500);
  }catch(e){
    return name+': NETWORK FAILURE\n'+(e&&e.message?e.message:String(e));
  }
}
async function run(){
  const o=document.getElementById('out');o.textContent='Testing…';
  const a=await probe('AUTH',base+'/auth/v1/health',{headers:{apikey:key}});
  const b=await probe('DATA API',base+'/rest/v1/transactions?select=id&limit=1',{headers:{apikey:key,Authorization:'Bearer '+key}});
  const c=await probe('PROJECT ROOT',base+'/',{headers:{apikey:key}});
  o.textContent=[a,b,c].join('\n\n');
}
run();
</script></body></html>
